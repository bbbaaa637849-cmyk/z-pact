name: Build Z-PACT Enterprise Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile & Package Z-PACT Enterprise APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android_app/gradlew

      - name: Build Triple Debug APKs (Admin Radar + Teacher Store + Sender Team)
        working-directory: ./android_app
        run: ./gradlew assembleAdminDebug assembleTeacherDebug assembleSenderDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build_output
          cp android_app/app/build/outputs/apk/admin/debug/app-admin-debug.apk build_output/Z-PACT-Admin-Radar.apk
          cp android_app/app/build/outputs/apk/teacher/debug/app-teacher-debug.apk build_output/Z-PACT-Teacher-Store.apk
          cp android_app/app/build/outputs/apk/sender/debug/app-sender-debug.apk build_output/Z-PACT-Sender-Team.apk
          ls -lh build_output/

      - name: Upload Admin Radar APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-PACT-Admin-Radar.apk
          path: build_output/Z-PACT-Admin-Radar.apk
          retention-days: 30

      - name: Upload Teacher Store APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-PACT-Teacher-Store.apk
          path: build_output/Z-PACT-Teacher-Store.apk
          retention-days: 30

      - name: Upload Sender Team APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-PACT-Sender-Team.apk
          path: build_output/Z-PACT-Sender-Team.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "### 🚀 Z-PACT v3.0 Triple Android Build Completed!" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Admin APK:** Z-PACT-Admin-Radar.apk (SMS Auto-Radar + Inbox Catch-Up + OTA)" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Teacher APK:** Z-PACT-Teacher-Store.apk (Zero SMS Permissions — Play Protect Clean + OTA)" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Sender APK:** Z-PACT-Sender-Team.apk (Zero SMS Permissions — WhatsApp Dispatch & Commissions + OTA)" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Target SDK:** 34 (Android 14) | **Version:** 3.0.0" >> $GITHUB_STEP_SUMMARY

